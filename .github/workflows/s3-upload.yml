name: S3 Upload

# Uploads built artifacts to S3 and verifies them against the integrity manifest.
# Called by npm-publish.yml after a successful publish.
#
# To enable for all automated runs: in npm-publish.yml s3-upload job set enable-s3-upload: true
# To enable for a manual run: check the "Upload built artifacts to S3" checkbox in the dispatch UI

on:
  workflow_call:
    inputs:
      s3-path:
        description: 'Path within the S3 bucket (e.g. media-agents/browser/hls-js)'
        required: false
        type: string
      file-to-upload:
        description: 'Built file to upload (e.g. dist/umd/newrelic-video-hls.min.js)'
        required: false
        type: string
      package-version:
        description: 'Package version used to name the versioned S3 file'
        required: false
        type: string
      enable-s3-upload:
        description: 'Override the default ENABLE_S3_UPLOAD — set true to force enable from a manual dispatch'
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false

jobs:
  upload:
    name: Upload to S3 and Verify
    if: ${{ inputs.enable-s3-upload == true }}
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: s3-build-artifacts
        path: ${{ runner.temp }}/s3-artifacts

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Upload to S3
      env:
        S3_PATH: ${{ inputs.s3-path }}
        DIST_FILE: ${{ inputs.file-to-upload }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        FILE_NAME=$(basename "$DIST_FILE")
        BASE_NAME="${FILE_NAME%.min.js}"
        VERSIONED_NAME="${BASE_NAME}.${PACKAGE_VERSION}.min.js"
        LATEST_NAME="${BASE_NAME}.latest.min.js"
        S3_BUCKET="nr-downloads-main"
        cp "$RUNNER_TEMP/s3-artifacts/$FILE_NAME" "$VERSIONED_NAME"
        cp "$RUNNER_TEMP/s3-artifacts/$FILE_NAME" "$LATEST_NAME"
        aws s3 cp "$VERSIONED_NAME" "s3://${S3_BUCKET}/${S3_PATH}/${VERSIONED_NAME}"
        aws s3 cp "$LATEST_NAME" "s3://${S3_BUCKET}/${S3_PATH}/${LATEST_NAME}"
        echo "Uploaded $VERSIONED_NAME and $LATEST_NAME to s3://${S3_BUCKET}/${S3_PATH}/"

    - name: Verify S3 assets against manifest
      env:
        S3_PATH: ${{ inputs.s3-path }}
        MANIFEST: ${{ runner.temp }}/s3-artifacts/integrity-manifest.json
        S3_BUCKET: nr-downloads-main
      run: |
        mkdir -p /tmp/s3-verify
        FAILURES=0
        while IFS= read -r KEY; do
          EXPECTED=$(jq -r ".files[\"$KEY\"].sha384" "$MANIFEST")
          aws s3 cp "s3://${S3_BUCKET}/${S3_PATH}/${KEY}" "/tmp/s3-verify/${KEY}" --quiet
          ACTUAL="sha384-$(openssl dgst -sha384 -binary "/tmp/s3-verify/${KEY}" | openssl base64 -A)"
          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "  ✓ ${KEY}"
          else
            echo "  ✗ MISMATCH: ${KEY}"
            echo "    expected: ${EXPECTED}"
            echo "    actual:   ${ACTUAL}"
            FAILURES=$((FAILURES+1))
          fi
        done < <(jq -r '.files | keys[]' "$MANIFEST")
        if [ "$FAILURES" -gt 0 ]; then
          echo "::error::${FAILURES} S3 file(s) failed integrity verification"
          exit 1
        fi
        echo "All S3 assets verified against integrity manifest ✓"
