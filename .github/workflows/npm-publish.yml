name: Publish Module

# This workflow publishes the @newrelic/video-core package to npmjs.org via 
# "Trusted Publishing" (https://docs.npmjs.com/trusted-publishers).
#
# This workflow assumes that the `(package.json).version` field has been updated
# with the version string that should be published.
#
# This workflow will create a new git tag for the module version, along with
# a new GitHub release. It will then publish the new module version to npmjs.org.
#
# This workflow can be triggered automatically when a release is published,
# or manually via the GitHub Actions interface.
on:
  # Manual trigger with optional S3 upload
  workflow_dispatch:
    inputs:
      s3-path:
        description: 'Path within the S3 bucket (optional)'
        required: false
        type: string
      file-to-upload:
        description: 'Specific file to upload to S3 (optional)'
        required: false
        type: string
  # Reusable workflow for other workflows to call
  workflow_call:
    inputs:
      s3-path:
        description: 'Path within the S3 bucket'
        required: false
        type: string
      file-to-upload:
        description: 'Specific file to upload to S3'
        required: false
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        description: 'AWS Access Key ID'
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: 'AWS Secret Access Key'
        required: false

permissions:
  contents: write      # create/upload GitHub Release
  id-token: write      # npm Trusted Publishing + attestation OIDC
  attestations: write  # actions/attest-build-provenance

jobs:
  publish_and_deploy:
    # Run when: release published, manually triggered, or called by another workflow
    if: ${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package-version.outputs.package-version }}
      release-tag: ${{ steps.package-version.outputs.release-tag }}
    steps:
    - name: Log trigger event
      env:
        EVENT_NAME: ${{ github.event_name }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        echo "## NPM Publish Triggered" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "$EVENT_NAME" = "release" ]; then
          echo "- **Trigger**: Automatic (Release published)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag**: $RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
        elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
          echo "- **Trigger**: Manual" >> $GITHUB_STEP_SUMMARY
        else
          echo "- **Trigger**: Workflow call" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup git
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # Trusted Publishing requires `npm@11.5.1` or later. Compatible
        # versions of `npm` started shipping with Node.js v24.5.0.
        # Hardcoded to ensure NPM Trusted Publishing compatibility.
        node-version: '24.x'
        cache: 'npm'
        # This is important. The OIDC exchange requires that the registry
        # URL matches on both ends.
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build project
      run: npm run build

    - name: Get Package Version
      id: package-version
      run: |
        PACKAGE_VERSION=$(jq -r '.version' package.json)
        echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
        echo "package-version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        echo "release-tag=v$PACKAGE_VERSION" >> $GITHUB_OUTPUT
        if echo "$PACKAGE_VERSION" | grep -q "beta"; then
          echo "NPM_TAG=beta" >> $GITHUB_ENV
        else
          echo "NPM_TAG=latest" >> $GITHUB_ENV
        fi

    - name: Run security audit
      run: npm audit --audit-level=critical

    - name: Generate integrity manifest
      if: ${{ inputs.file-to-upload != '' || github.event_name == 'workflow_call' }}
      env:
        DIST_FILE: ${{ inputs.file-to-upload }}
        RELEASE_TAG: v${{ env.PACKAGE_VERSION }}
      run: |
        mkdir -p "$RUNNER_TEMP/integrity"
        node .github/scripts/generate-integrity-manifest.mjs \
          "$RUNNER_TEMP/integrity/integrity-manifest.json" \
          "$RUNNER_TEMP/integrity/checksums.txt" \
          "$RELEASE_TAG" "$GITHUB_SHA"

    - name: Attest build provenance
      if: ${{ inputs.file-to-upload != '' || github.event_name == 'workflow_call' }}
      uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
      with:
        subject-checksums: ${{ runner.temp }}/integrity/checksums.txt

    - name: Create GitHub Release (draft)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ env.PACKAGE_VERSION }}"
        body=$(awk -v ver="${{ env.PACKAGE_VERSION }}" '
          found && /^## +\[|^# / { exit }
          found { print }
          $0 ~ ("^## +\\[" ver "\\]") { found=1 }
        ' CHANGELOG.md | sed -E 's/ *\(\[[0-9a-f]{6,40}\]\([^)]*\)\) *$//')
        body=$(printf '%s' "${body}" | sed '/[^[:space:]]/,$!d' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba}')
        if [[ -z "${body}" ]]; then
          body="_No new features, improvements, or bug fixes for this release._"
        fi
        gh release create "$TAG" \
          --draft \
          --title "Release $TAG" \
          --notes "${body}" \
          --verify-tag
        echo "Created draft release $TAG"

    - name: Upload integrity manifest to draft release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ env.PACKAGE_VERSION }}"
        MANIFEST="$RUNNER_TEMP/integrity/integrity-manifest.json"
        if [ -f "$MANIFEST" ]; then
          gh release upload "$TAG" "$MANIFEST"
          echo "Uploaded integrity manifest to draft release $TAG"
        fi

    - name: Publish GitHub Release (immutable)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v${{ env.PACKAGE_VERSION }}"
        gh release publish "$TAG"
        echo "Published release $TAG — now immutable"

    - name: Publish to NPM
      env:
        NPM_PUBLISH_TAG: ${{ env.NPM_TAG }}
      run: npm publish --tag "$NPM_PUBLISH_TAG"

    - name: Publish Summary
      run: |
        echo "## ✅ Publish Complete" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Package**: @newrelic/video-core" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ env.PACKAGE_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "- **NPM Tag**: ${{ env.NPM_TAG }}" >> $GITHUB_STEP_SUMMARY
        echo "- **NPM URL**: https://www.npmjs.com/package/@newrelic/video-core/v/${{ env.PACKAGE_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Installation" >> $GITHUB_STEP_SUMMARY
        echo '```bash' >> $GITHUB_STEP_SUMMARY
        echo "npm install @newrelic/video-core@${{ env.PACKAGE_VERSION }}" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY

  s3-upload:
    name: Upload to S3 and Verify
    needs: publish_and_deploy
    if: ${{ inputs.s3-path != '' }}
    uses: newrelic/video-core-js/.github/workflows/s3-upload.yml@master
    with:
      release-tag: ${{ needs.publish_and_deploy.outputs.release-tag }}
      s3-path: ${{ inputs.s3-path }}
      enable-s3-upload: false   # ← set to true when AWS credentials are configured in npm-release environment
    secrets: inherit
